spring:
  application:
    name: greeting-service
  config:
    import: "optional:configserver:http://localhost:8888"
  cloud:
    config:
      #profile é o ambiente que você quer rodar, por exemplo: dev, test, prod
      profile: it
server:
  port: 8080
management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: always
