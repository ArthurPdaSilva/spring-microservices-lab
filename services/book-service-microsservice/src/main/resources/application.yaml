spring:
  application:
    name: book-service-microsservice
  datasource:
    url: jdbc:mysql://localhost:3306/microservice_section_7
    username: spring
    password: spring
    driver-class-name: com.mysql.cj.jdbc.Driver
  flyway:
    table: flyway_schema_history_book
    baseline-on-migrate: true
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
    open-in-view: false
server:
  port: 8100
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8671/eureka/}
management:
  tracing:
    sampling:
      probability: 1.0
    export:
      zipkin:
        endpoint: ${ZIPKIN_ENDPOINT:http://localhost:9411/api/v2/spans}
resilience4j:
  retry:
    instances:
      foo-bar:
        max-attempts: 3
        wait-duration: 1s
  rate-limiter:
    instances:
      foo-bar:
        limit-for-period: 2
        limit-refresh-period: 10s
  bulkhead:
    instances:
      foo-bar:
        max-concurrent-calls: 2
        max-wait-duration: 1s
