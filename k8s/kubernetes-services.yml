apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      containers:
        - name: api-gateway
          image: arthurpsillva/spring-microservices-lab-api-gateway:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8765
          env:
            - name: SERVER_PORT
              value: "8765"
            - name: BOOK_SERVICE_URL
              value: http://book-service:8100
            - name: EXCHANGE_SERVICE_URL
              value: http://exchange-service:8000
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 15
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
spec:
  type: LoadBalancer
  selector:
    app: api-gateway
  ports:
    - name: http
      port: 8765
      targetPort: http
